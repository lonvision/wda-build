# 用途：在 GitHub 的 macOS 机器上编译 WebDriverAgent，产出可交给「巨魔」安装的 ipa
# 位置：仓库根目录下的 .github/workflows/build-wda.yml（注意前面有一个点）
# 触发：仓库 → Actions → 左侧 build-wda → 右侧 Run workflow
#
# === v2 相比 v1 只改了一处：打包阶段先清掉 Apple 平台框架原有的签名、并裁成 arm64 单架构 ===
# 原因：装出 175（ldid 签名返回非零）时，最可疑的是从 Xcode 平台目录搬进来的
#       XCTest / XCTAutomationSupport / XCUIAutomation —— 它们是苹果签过的、常常是 arm64e 的多架构二进制，
#       ldid 重新签名时最容易在这类"外来二进制"上翻车。先 remove-signature + 瘦身，等于把它变成
#       一个干净、单架构、无签名的普通 Mach-O 再交给巨魔。
name: build-wda

on:
  workflow_dispatch:
    inputs:
      ios_min:
        description: "最低支持系统版本（iOS 15 填 15.0，iOS 16 填 16.0，iOS 17 填 17.0）"
        required: false
        default: "15.0"
  push:
    branches: [main]

jobs:
  build:
    # macos-15 自带 Xcode 16.x。不要写 macos-13：它已被 GitHub 下线，任务会永远排队不动。
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 1. 拉取 WebDriverAgent 源码
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          path: wda

      - name: 2. 打印工具链版本（出错先看这一步）
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "DEVELOPER_DIR=$(xcode-select -p)"

      - name: 3. 打补丁：删掉 Assets.xcassets
        working-directory: wda
        run: |
          # Xcode 16 的 actool 编译 WDA 自带的图标资源会失败（CompileAssetCatalog 报错）。
          # 跑自动化的 runner 不需要图标，直接删掉这个目录绕过 actool。
          rm -rf WebDriverAgentRunner/Assets.xcassets
          echo "已删除 Assets.xcassets"
          ls WebDriverAgentRunner/

      - name: 4. 编译（禁止签名）
        working-directory: wda
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            IPHONEOS_DEPLOYMENT_TARGET=${{ inputs.ios_min || '15.0' }} \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME= \
            ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -100

      - name: 5. 打包：补 XCTest 运行库 → 清理签名并瘦身 → 改路径 → 重签 → 压 ipa
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/dd" -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "!! 编译产物里没找到 WebDriverAgentRunner-Runner.app"
            find "$RUNNER_TEMP/dd" -name "*.app" -maxdepth 8
            exit 1
          fi
          echo "APP=$APP"
          BIN="$APP/WebDriverAgentRunner-Runner"
          lipo -info "$BIN" || file "$BIN"

          # ── 5.1 把 XCTest 运行时搬进 App 内部 ──
          # build-for-testing 不会把 XCTest.framework 打进来，真机上又没有 /Developer 目录。
          # 缺了它 WDA 一启动就 dyld 找不到符号直接闪退，所以必须自带。
          DEV=$(xcode-select -p)
          PLAT="$DEV/Platforms/iPhoneOS.platform/Developer"
          mkdir -p "$APP/Frameworks"
          for fw in XCTest XCTAutomationSupport XCUIAutomation; do
            for base in "$PLAT/Library/Frameworks" "$PLAT/Library/PrivateFrameworks"; do
              if [ -d "$base/$fw.framework" ]; then
                cp -R "$base/$fw.framework" "$APP/Frameworks/"
                echo "  + $fw.framework"
                break
              fi
            done
          done
          cp "$PLAT/usr/lib/libXCTestBundleInject.dylib" "$APP/Frameworks/" 2>/dev/null \
            && echo "  + libXCTestBundleInject.dylib" || true

          # ── 5.2 【v2 新增】清掉原有的苹果签名，并把多架构裁成 arm64 ──
          # 目的：交给巨魔一个"干净的无签名单架构 Mach-O"，避开 ldid 在 arm64e/多架构上出错。
          strip_and_thin() {
            b="$1"
            [ -f "$b" ] || return 0
            echo "--- $b"
            lipo -info "$b" 2>/dev/null || file "$b"
            codesign --remove-signature "$b" >/dev/null 2>&1 || true
            if lipo -info "$b" 2>/dev/null | grep -q "Architectures in the fat file"; then
              if lipo -thin arm64 "$b" -output "$b.arm64" 2>/dev/null; then
                mv "$b.arm64" "$b"
                echo "    -> 已裁成 arm64 单架构"
              else
                rm -f "$b.arm64"
                echo "    -> 无 arm64 切片，保持原样"
              fi
            fi
          }
          for fw in XCTest XCTAutomationSupport XCUIAutomation; do
            strip_and_thin "$APP/Frameworks/$fw.framework/$fw"
          done
          strip_and_thin "$APP/Frameworks/libXCTestBundleInject.dylib"
          while IFS= read -r -d '' x; do
            strip_and_thin "$x/$(basename "$x" .xctest)"
          done < <(find "$APP" -name "*.xctest" -type d -print0)

          # ── 5.3 把写死的 /Developer/... 绝对路径改成 @rpath ──
          ABS_XCTEST="/Developer/Library/Frameworks/XCTest.framework/XCTest"
          ABS_XAS="/Developer/Library/PrivateFrameworks/XCTAutomationSupport.framework/XCTAutomationSupport"
          ABS_XCUI="/Developer/Library/PrivateFrameworks/XCUIAutomation.framework/XCUIAutomation"
          fix() {
            b="$1"
            [ -f "$b" ] || return 0
            file "$b" | grep -q "Mach-O" || return 0
            install_name_tool -change "$ABS_XCTEST" "@rpath/XCTest.framework/XCTest" "$b" 2>/dev/null || true
            install_name_tool -change "$ABS_XAS" "@rpath/XCTAutomationSupport.framework/XCTAutomationSupport" "$b" 2>/dev/null || true
            install_name_tool -change "$ABS_XCUI" "@rpath/XCUIAutomation.framework/XCUIAutomation" "$b" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/Frameworks" "$b" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/Frameworks" "$b" 2>/dev/null || true
          }
          for f in "$APP/Frameworks/"*.framework; do
            [ -d "$f" ] || continue
            nm=$(basename "$f" .framework)
            install_name_tool -id "@rpath/$nm.framework/$nm" "$f/$nm" 2>/dev/null || true
            fix "$f/$nm"
          done
          fix "$BIN"
          while IFS= read -r -d '' x; do
            fix "$x/$(basename "$x" .xctest)"
          done < <(find "$APP" -name "*.xctest" -type d -print0)

          echo "--- Runner 依赖库 ---"; otool -L "$BIN" | head -20
          echo "--- rpath ---";        otool -l "$BIN" | grep -A2 LC_RPATH | head -20

          # ── 5.4 ad-hoc 重签：先内层后外层 ──
          # 这几个 entitlement 决定 WDA 能否操作别的 App；巨魔靠 CoreTrust 放行未签名包。
          # 注意：巨魔安装时会"继承"这里的 entitlements 再重签一次，所以这一步不能省。
          cat > "$RUNNER_TEMP/ent.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key><true/>
            <key>platform-application</key><true/>
            <key>task_for_pid-allow</key><true/>
            <key>run-unsigned-code</key><true/>
            <key>com.apple.security.cs.allow-jit</key><true/>
          </dict>
          </plist>
          PLIST

          find "$APP/Frameworks" -name "*.framework" -maxdepth 2 -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do codesign --force --sign - "$f" >/dev/null 2>&1 || true; done
          find "$APP" -name "*.dylib" -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do codesign --force --sign - "$f" >/dev/null 2>&1 || true; done
          codesign --force --sign - --entitlements "$RUNNER_TEMP/ent.plist" "$APP"
          echo "--- 签名检查 ---"
          codesign -dv --entitlements - "$APP" 2>&1 | head -30 || true

          # ── 5.5 压 ipa：必须是 Payload/xxx.app 结构 ──
          mkdir -p "$RUNNER_TEMP/Payload"
          rm -rf "$RUNNER_TEMP/Payload/"*.app
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          rm -f WebDriverAgent.ipa
          zip -qry WebDriverAgent.ipa Payload
          ls -lh WebDriverAgent.ipa
          echo "--- ipa 内部结构（Frameworks/ 必须在，不能有 __MACOSX）---"
          unzip -l WebDriverAgent.ipa | grep -E "Frameworks/|Runner.app/$|Info.plist|__MACOSX" | head -25

      - name: 6. 上传 ipa 成品
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: ${{ runner.temp }}/WebDriverAgent.ipa
          retention-days: 7
